# Backend only. Mirrors the service as deployed via the Render connector (no rootDir, so commands cd into backend).
# Secrets are NOT stored here: their values are set in the Render dashboard (sync: false).
services:
  - type: web
    name: pramaan-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION  # not a secret; backend/.python-version is only read when rootDir is backend
        value: 3.11.11
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_PRIMARY
        sync: false
      - key: GROQ_MODEL_FAST
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
