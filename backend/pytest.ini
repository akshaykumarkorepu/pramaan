[pytest]
pythonpath = . tests
testpaths = tests
# live tests (real RBI/SEBI/PIB sites and the real Groq API) are excluded by default; run them with `pytest -m live`
addopts = -m "not live"
markers =
    live: hits the real RBI/SEBI/PIB sites or the real Groq API (needs network and a key; Groq's free tier allows 8,000 tokens/min per model)
